<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Phase 2 · Semantic Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #333; }
    header { background: #0f9d58; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; font-weight: 600; }
    header span { font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 12px; }
    nav { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 0 24px; display: flex; }
    nav a { display: inline-block; padding: 12px 16px; font-size: 14px; color: #555; text-decoration: none; border-bottom: 3px solid transparent; }
    nav a:hover { color: #0f9d58; }
    nav a.active { color: #0f9d58; border-bottom-color: #0f9d58; font-weight: 600; }
    main { max-width: 800px; margin: 32px auto; padding: 0 16px; }
    .search-box { display: flex; gap: 8px; margin-bottom: 24px; }
    .search-box input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; }
    .search-box input:focus { border-color: #0f9d58; box-shadow: 0 0 0 3px rgba(15,157,88,.15); }
    .search-box button { padding: 10px 20px; background: #0f9d58; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    .search-box button:hover { background: #0b7a43; }
    .examples { margin-bottom: 20px; }
    .examples span { font-size: 13px; color: #888; margin-right: 8px; }
    .tag { display: inline-block; background: #e8f5e9; color: #2e7d32; border-radius: 14px; padding: 4px 12px; font-size: 13px; cursor: pointer; margin: 3px; }
    .tag:hover { background: #c8e6c9; }
    .result-card { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .result-card .file { font-weight: 600; color: #0f9d58; }
    .result-card .bar-wrap { margin-top: 8px; background: #e8f5e9; border-radius: 4px; height: 6px; }
    .result-card .bar { background: #0f9d58; height: 6px; border-radius: 4px; }
    .result-card .score { font-size: 12px; color: #888; }
    .result-card .snippet { margin-top: 8px; font-size: 14px; color: #555; line-height: 1.6; }
    .empty { text-align: center; color: #999; padding: 48px 0; }
    .count { font-size: 14px; color: #666; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>On-Call Assistant</h1>
    <span>Phase 2 · Semantic Search</span>
  </header>
  <nav>
    <a href="/v1">关键词搜索</a>
    <a href="/v2" class="active">语义搜索</a>
    <a href="/v3">Agent 对话</a>
  </nav>
  <main>
    <div class="examples">
      <span>示例：</span>
      <span class="tag" onclick="setQ('服务器挂了')">服务器挂了</span>
      <span class="tag" onclick="setQ('黑客攻击')">黑客攻击</span>
      <span class="tag" onclick="setQ('机器学习模型出问题')">机器学习模型出问题</span>
      <span class="tag" onclick="setQ('数据库同步延迟')">数据库同步延迟</span>
    </div>
    <div class="search-box">
      <input type="text" id="queryInput" placeholder="用自然语言描述问题，无需精确关键词…" />
      <button onclick="search()">搜索</button>
    </div>
    <div id="results"></div>
  </main>
  <script>
    document.getElementById('queryInput').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    function setQ(q) { document.getElementById('queryInput').value = q; search(); }

    async function search() {
      const q = document.getElementById('queryInput').value.trim();
      if (!q) return;
      const res = await fetch('/v2/search?q=' + encodeURIComponent(q));
      const data = await res.json();
      const el = document.getElementById('results');
      if (!data.results || data.results.length === 0) {
        el.innerHTML = '<div class="empty">未找到相关文档</div>';
        return;
      }
      const maxScore = data.results[0].score;
      el.innerHTML = `<div class="count">找到 ${data.total} 个相关文档</div>` +
        data.results.map(r => {
          const pct = maxScore > 0 ? Math.round((r.score / maxScore) * 100) : 0;
          return `
            <div class="result-card">
              <div><span class="file">${r.file}</span> <span class="score">相关度 ${(r.score * 100).toFixed(1)}%</span></div>
              <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
              <div class="snippet">${r.snippet}</div>
            </div>`;
        }).join('');
    }
  </script>
</body>
</html>
