<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Phase 3 · On-Call Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f7fa; color: #333; display: flex; flex-direction: column; height: 100vh; }
    header { background: #7b1fa2; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    header h1 { font-size: 18px; font-weight: 600; }
    header span { font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 12px; }
    nav { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 0 24px; display: flex; flex-shrink: 0; }
    nav a { display: inline-block; padding: 12px 16px; font-size: 14px; color: #555; text-decoration: none; border-bottom: 3px solid transparent; }
    nav a:hover { color: #7b1fa2; }
    nav a.active { color: #7b1fa2; border-bottom-color: #7b1fa2; font-weight: 600; }
    #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 75%; }
    .msg.user { align-self: flex-end; }
    .msg.assistant { align-self: flex-start; }
    .bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .msg.user .bubble { background: #7b1fa2; color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant .bubble { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); border-bottom-left-radius: 4px; }
    .tool-block { background: #f3e5f5; border-left: 3px solid #7b1fa2; border-radius: 4px; padding: 8px 12px; margin-top: 8px; font-size: 12px; color: #4a0072; font-family: monospace; }
    .tool-block .tool-title { font-weight: 700; margin-bottom: 4px; }
    .tool-block .tool-detail { color: #6a0080; word-break: break-all; }
    .input-area { background: #fff; border-top: 1px solid #e0e0e0; padding: 12px 16px; display: flex; gap: 8px; flex-shrink: 0; }
    .input-area textarea { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; font-size: 14px; resize: none; outline: none; height: 48px; max-height: 120px; font-family: inherit; }
    .input-area textarea:focus { border-color: #7b1fa2; }
    .input-area button { padding: 10px 20px; background: #7b1fa2; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .input-area button:disabled { background: #bbb; cursor: not-allowed; }
    .clear-btn { padding: 10px 14px; background: transparent; color: #999; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .clear-btn:hover { color: #333; border-color: #aaa; }
    .examples { display: flex; gap: 8px; padding: 8px 16px; background: #fafafa; border-top: 1px solid #f0f0f0; flex-wrap: wrap; flex-shrink: 0; }
    .ex-tag { font-size: 12px; background: #ede7f6; color: #4527a0; padding: 4px 10px; border-radius: 12px; cursor: pointer; }
    .ex-tag:hover { background: #d1c4e9; }
    .thinking { color: #999; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <h1>On-Call Assistant</h1>
    <span>Phase 3 · Agent 对话</span>
  </header>
  <nav>
    <a href="/v1">关键词搜索</a>
    <a href="/v2">语义搜索</a>
    <a href="/v3" class="active">Agent 对话</a>
  </nav>
  <div id="chat">
    <div class="msg assistant">
      <div class="bubble">你好！我是 On-Call 助手。告诉我你遇到的问题，我会查阅相关 SOP 文档帮你解决。</div>
    </div>
  </div>
  <div class="examples">
    <span style="font-size:12px;color:#999;align-self:center;">示例：</span>
    <span class="ex-tag" onclick="setQ('数据库主从同步延迟告警，怎么处理？')">数据库主从同步延迟</span>
    <span class="ex-tag" onclick="setQ('后端服务 OOM 崩溃了，紧急处理步骤是什么？')">服务 OOM 崩溃</span>
    <span class="ex-tag" onclick="setQ('发生了 P0 安全事件，应该怎么办？')">P0 安全事件</span>
    <span class="ex-tag" onclick="setQ('推荐系统效果变差了，可能是什么原因？')">推荐质量变差</span>
  </div>
  <div class="input-area">
    <button class="clear-btn" onclick="clearChat()">清空</button>
    <textarea id="msgInput" placeholder="描述你的 on-call 问题…" onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" onclick="send()">发送</button>
  </div>

  <script>
    let history = [];

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    }

    function setQ(q) { document.getElementById('msgInput').value = q; send(); }

    function clearChat() {
      history = [];
      const chat = document.getElementById('chat');
      chat.innerHTML = '<div class="msg assistant"><div class="bubble">你好！我是 On-Call 助手。告诉我你遇到的问题，我会查阅相关 SOP 文档帮你解决。</div></div>';
    }

    function appendMsg(role, text, toolCalls) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      let html = `<div class="bubble">${escHtml(text)}</div>`;
      if (toolCalls && toolCalls.length > 0) {
        html += toolCalls.map(t => `
          <div class="tool-block">
            <div class="tool-title">🔧 调用工具：${t.tool}</div>
            <div class="tool-detail">参数：${JSON.stringify(t.input)}</div>
            <div class="tool-detail">返回预览：${escHtml(t.result_preview)}…</div>
          </div>`).join('');
      }
      div.innerHTML = html;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function send() {
      const input = document.getElementById('msgInput');
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      const btn = document.getElementById('sendBtn');
      btn.disabled = true;

      appendMsg('user', msg, null);

      const thinking = document.createElement('div');
      thinking.className = 'msg assistant';
      thinking.innerHTML = '<div class="bubble thinking">正在查阅 SOP 文档…</div>';
      document.getElementById('chat').appendChild(thinking);
      document.getElementById('chat').scrollTop = 99999;

      try {
        const res = await fetch('/v3/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, history }),
        });
        const data = await res.json();
        thinking.remove();
        appendMsg('assistant', data.reply, data.tool_calls);
        history = data.history;
      } catch (err) {
        thinking.remove();
        appendMsg('assistant', '请求失败：' + err.message, null);
      } finally {
        btn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
