<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Antigravity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #ffffff;
      font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
      color: #202124;
      overflow-x: hidden;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .page { position: relative; z-index: 1; min-height: 100vh; }

    /* ── Navigation ── */
    .nav {
      display: flex;
      align-items: center;
      padding: 0 28px;
      height: 64px;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .nav-logo {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; margin-right: 28px; flex-shrink: 0;
    }
    .nav-logo-text { font-size: 15px; font-weight: 500; color: #202124; letter-spacing: -0.1px; }

    .nav-links {
      display: flex; align-items: center; gap: 2px;
      list-style: none; flex: 1;
    }
    .nav-links a {
      display: flex; align-items: center; gap: 3px;
      padding: 7px 12px;
      font-size: 14px; font-weight: 400; color: #3c4043;
      text-decoration: none; border-radius: 20px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover { background: rgba(32,33,36,0.07); }

    .nav-download {
      background: #202124; color: #fff !important;
      border-radius: 20px; padding: 9px 18px !important;
      font-weight: 500; font-size: 14px; gap: 5px;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .nav-download:hover { background: rgba(32,33,36,0.85) !important; }

    .chev { width: 14px; height: 14px; opacity: 0.7; }

    /* ── Hero ── */
    .hero {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 96px 32px 80px;
    }

    .hero-badge {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 28px;
    }
    .hero-badge-text { font-size: 15px; color: #3c4043; font-weight: 400; }

    .hero-headline {
      font-size: clamp(38px, 5.5vw, 64px);
      font-weight: 700;
      color: #202124;
      line-height: 1.13;
      max-width: 820px;
      margin-bottom: 40px;
      letter-spacing: -0.5px;
    }

    .hero-buttons {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    }

    .btn-primary {
      display: flex; align-items: center; gap: 9px;
      background: #202124; color: #fff;
      border: none; border-radius: 24px;
      padding: 15px 28px; font-size: 16px; font-weight: 500;
      font-family: inherit; text-decoration: none; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:hover { background: #3c4043; }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      display: flex; align-items: center;
      background: transparent; color: #202124;
      border: 1.5px solid #dadce0; border-radius: 24px;
      padding: 14px 28px; font-size: 16px; font-weight: 500;
      font-family: inherit; text-decoration: none; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-secondary:hover { background: rgba(32,33,36,0.04); border-color: #bdc1c6; }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="page">
  <nav class="nav">
    <a href="#" class="nav-logo">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M13 1 L25 23 L1 23 Z" fill="#1a1f2e"/>
        <path d="M13 9 L21 22 L5 22 Z" fill="#ffffff"/>
        <rect x="7" y="16" width="12" height="2.8" rx="0.4" fill="#1a1f2e"/>
      </svg>
      <span class="nav-logo-text">Google Antigravity</span>
    </a>

    <ul class="nav-links">
      <li><a href="#">Product</a></li>
      <li>
        <a href="#">Use Cases
          <svg class="chev" viewBox="0 0 14 14" fill="none">
            <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </a>
      </li>
      <li><a href="#">Pricing</a></li>
      <li><a href="#">Blog</a></li>
      <li>
        <a href="#">Resources
          <svg class="chev" viewBox="0 0 14 14" fill="none">
            <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </a>
      </li>
    </ul>

    <a href="#" class="nav-links nav-download">
      Download
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 2v8M4 8l3 3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </nav>

  <main class="hero">
    <div class="hero-badge">
      <svg width="20" height="20" viewBox="0 0 26 26" fill="none">
        <path d="M13 1 L25 23 L1 23 Z" fill="#1a1f2e"/>
        <path d="M13 9 L21 22 L5 22 Z" fill="#ffffff"/>
        <rect x="7" y="16" width="12" height="2.8" rx="0.4" fill="#1a1f2e"/>
      </svg>
      <span class="hero-badge-text">Google Antigravity</span>
    </div>

    <h1 class="hero-headline">
      Experience liftoff with the<br>next-gen agent platform
    </h1>

    <div class="hero-buttons">
      <a href="#" class="btn-primary">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="currentColor">
          <rect x="0" y="0" width="7.8" height="7.8"/>
          <rect x="9.2" y="0" width="7.8" height="7.8"/>
          <rect x="0" y="9.2" width="7.8" height="7.8"/>
          <rect x="9.2" y="9.2" width="7.8" height="7.8"/>
        </svg>
        Download for Windows
      </a>
      <a href="#" class="btn-secondary">Explore use cases</a>
    </div>
  </main>
</div>

<script>
// ─────────────────────────────────────────────
//  极坐标粒子系统
//  核心：圆周轨道运动 + 鼠标斥力场偏移 + 弹簧-lerp 回归轨道
// ─────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

let W = 0, H = 0, cx = 0, cy = 0;
const mouse = { x: -9999, y: -9999 };

// Google 品牌色（低饱和度明亮调）
const COLORS = [
  '#4285F4', '#1A73E8', '#1557B0',          // 蓝
  '#EA4335', '#C62828', '#E53935',          // 红
  '#FBBC04', '#F9A825', '#FFB300',          // 黄
  '#34A853', '#1E8E3E', '#00897B',          // 绿
  '#9334EA', '#7C4DFF', '#651FFF',          // 紫
  '#FF6D00', '#F57C00', '#FF8F00',          // 橙
];

// ── Particle ──────────────────────────────────
class Particle {
  constructor() {
    this.init();
  }

  init() {
    const maxR = Math.min(W, H) * 0.46;

    // 极坐标：轨道半径、初始角度、角速度
    this.r     = 48 + Math.random() * maxR;
    this.theta = Math.random() * Math.PI * 2;
    const dir  = Math.random() < 0.5 ? 1 : -1;
    // 外圈角速度略慢（模拟开普勒效应）
    this.omega = dir * (0.002 + Math.random() * 0.006) * (1 - this.r / (maxR * 2.4));

    // 视觉：短矩形，沿切线朝向
    this.len   = 2.5 + Math.random() * 5.5;
    this.thick = 1.2 + Math.random() * 1.2;
    this.color   = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.opacity = 0.55 + Math.random() * 0.40;

    // 轨道偏移量（由鼠标力场产生，弹簧回归）
    this.ox = 0; this.oy  = 0;
    this.vox = 0; this.voy = 0;

    this.x = cx + this.r * Math.cos(this.theta);
    this.y = cy + this.r * Math.sin(this.theta);
  }

  update() {
    // ① 推进角度 → 圆周运动
    this.theta += this.omega;

    // ② 基准轨道坐标
    const bx = cx + this.r * Math.cos(this.theta);
    const by = cy + this.r * Math.sin(this.theta);

    // ③ 当前实际位置（含偏移）
    const px = bx + this.ox;
    const py = by + this.oy;

    // ④ 鼠标斥力场
    const dx = px - mouse.x;
    const dy = py - mouse.y;
    const d2 = dx * dx + dy * dy;
    const R  = 160;
    if (d2 < R * R && d2 > 0.5) {
      const d = Math.sqrt(d2);
      const f = ((R - d) / R) * 2.2;
      this.vox += (dx / d) * f;
      this.voy += (dy / d) * f;
    }

    // ⑤ 弹簧回归（偏移越大、回归力越强，等效 lerp 缓动）
    this.vox += -this.ox * 0.055;
    this.voy += -this.oy * 0.055;

    // ⑥ 阻尼
    this.vox *= 0.80;
    this.voy *= 0.80;

    // ⑦ 积分
    this.ox += this.vox;
    this.oy += this.voy;

    this.x = bx + this.ox;
    this.y = by + this.oy;
  }

  draw() {
    // 切线方向角（粒子朝向与轨道切线对齐）
    const tangent = this.theta + Math.PI / 2;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(tangent);
    ctx.globalAlpha = this.opacity;
    ctx.fillStyle   = this.color;
    ctx.fillRect(-this.len / 2, -this.thick / 2, this.len, this.thick);
    ctx.restore();
  }
}

// ── Resize ────────────────────────────────────
let particles = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H * 0.50;   // 力场中心：页面垂直中部
}

function init() {
  resize();
  const count = Math.round(Math.min(480, W * H / 2600));
  particles = Array.from({ length: count }, () => new Particle());
}

// ── 动画循环 ──────────────────────────────────
function tick() {
  ctx.clearRect(0, 0, W, H);
  for (const p of particles) { p.update(); p.draw(); }
  requestAnimationFrame(tick);
}

// ── 事件 ──────────────────────────────────────
window.addEventListener('mousemove',  e  => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
window.addEventListener('resize', () => {
  resize();
  for (const p of particles) p.init();
});

// 点击爆炸
window.addEventListener('click', e => {
  const bx = e.clientX, by = e.clientY;
  for (const p of particles) {
    const dx = p.x - bx, dy = p.y - by;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    if (d < 240) {
      const f = (240 - d) / 240 * 6;
      p.vox += dx / d * f;
      p.voy += dy / d * f;
    }
  }
});

init();
tick();
</script>
</body>
</html>
