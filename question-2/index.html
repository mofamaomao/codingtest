<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Antigravity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #ffffff;
      font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
      color: #202124;
      overflow-x: hidden;
    }

    /* ── Canvas ── */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Page wrapper ── */
    .page { position: relative; z-index: 1; min-height: 100vh; }

    /* ── Navigation ── */
    .nav {
      display: flex;
      align-items: center;
      padding: 0 28px;
      height: 64px;
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .nav-logo {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; margin-right: 28px; flex-shrink: 0;
    }
    .nav-logo-text { font-size: 15px; font-weight: 500; color: #202124; letter-spacing: -0.1px; }

    .nav-links {
      display: flex; align-items: center; gap: 2px;
      list-style: none; flex: 1;
    }
    .nav-links a {
      display: flex; align-items: center; gap: 3px;
      padding: 7px 12px;
      font-size: 14px; font-weight: 400; color: #3c4043;
      text-decoration: none; border-radius: 20px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .nav-links a:hover { background: rgba(32,33,36,0.07); }

    .nav-download {
      background: #202124; color: #fff !important;
      border-radius: 20px; padding: 9px 18px !important;
      font-weight: 500; font-size: 14px; gap: 5px;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .nav-download:hover { background: rgba(32,33,36,0.85) !important; }

    /* ── Chevron icon ── */
    .chev { width: 14px; height: 14px; opacity: 0.7; }

    /* ── Hero ── */
    .hero {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 96px 32px 80px;
    }

    .hero-badge {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 28px;
    }
    .hero-badge-text { font-size: 15px; color: #3c4043; font-weight: 400; }

    .hero-headline {
      font-size: clamp(38px, 5.5vw, 64px);
      font-weight: 700;
      color: #202124;
      line-height: 1.13;
      max-width: 820px;
      margin-bottom: 40px;
      letter-spacing: -0.5px;
    }

    .hero-buttons {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    }

    .btn-primary {
      display: flex; align-items: center; gap: 9px;
      background: #202124; color: #fff;
      border: none; border-radius: 24px;
      padding: 15px 28px; font-size: 16px; font-weight: 500;
      font-family: inherit; text-decoration: none; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0;
    }
    .btn-primary:hover { background: #3c4043; }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      display: flex; align-items: center;
      background: transparent; color: #202124;
      border: 1.5px solid #dadce0; border-radius: 24px;
      padding: 14px 28px; font-size: 16px; font-weight: 500;
      font-family: inherit; text-decoration: none; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-secondary:hover { background: rgba(32,33,36,0.04); border-color: #bdc1c6; }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="page">
  <!-- Navigation -->
  <nav class="nav">
    <a href="#" class="nav-logo">
      <!-- Google Antigravity "A" logo -->
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M13 1 L25 23 L1 23 Z" fill="#1a1f2e"/>
        <path d="M13 9 L21 22 L5 22 Z" fill="#ffffff"/>
        <rect x="7" y="16" width="12" height="2.8" rx="0.4" fill="#1a1f2e"/>
      </svg>
      <span class="nav-logo-text">Google Antigravity</span>
    </a>

    <ul class="nav-links">
      <li><a href="#">Product</a></li>
      <li>
        <a href="#">Use Cases
          <svg class="chev" viewBox="0 0 14 14" fill="none">
            <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </a>
      </li>
      <li><a href="#">Pricing</a></li>
      <li><a href="#">Blog</a></li>
      <li>
        <a href="#">Resources
          <svg class="chev" viewBox="0 0 14 14" fill="none">
            <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </a>
      </li>
    </ul>

    <a href="#" class="nav-links nav-download">
      Download
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 2v8M4 8l3 3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </nav>

  <!-- Hero -->
  <main class="hero">
    <div class="hero-badge">
      <svg width="20" height="20" viewBox="0 0 26 26" fill="none">
        <path d="M13 1 L25 23 L1 23 Z" fill="#1a1f2e"/>
        <path d="M13 9 L21 22 L5 22 Z" fill="#ffffff"/>
        <rect x="7" y="16" width="12" height="2.8" rx="0.4" fill="#1a1f2e"/>
      </svg>
      <span class="hero-badge-text">Google Antigravity</span>
    </div>

    <h1 class="hero-headline">
      Experience liftoff with the<br>next-gen agent platform
    </h1>

    <div class="hero-buttons">
      <a href="#" class="btn-primary">
        <!-- Windows logo -->
        <svg width="17" height="17" viewBox="0 0 17 17" fill="currentColor">
          <rect x="0" y="0" width="7.8" height="7.8"/>
          <rect x="9.2" y="0" width="7.8" height="7.8"/>
          <rect x="0" y="9.2" width="7.8" height="7.8"/>
          <rect x="9.2" y="9.2" width="7.8" height="7.8"/>
        </svg>
        Download for Windows
      </a>
      <a href="#" class="btn-secondary">Explore use cases</a>
    </div>
  </main>
</div>

<script>
// ─────────────────────────────────────────────
//  Particle System
// ─────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W = 0, H = 0;
const mouse = { x: -9999, y: -9999 };

// Google brand palette – blues/purples on left, reds/oranges/yellows on right
const COLORS = [
  '#4285F4', '#3367D6', '#1A73E8', '#1557B0',   // blues
  '#7C4DFF', '#651FFF', '#9334EA', '#6B21A8',   // purples
  '#3949AB', '#283593', '#3D1FAB',               // indigo/deep blue
  '#EA4335', '#D32F2F', '#C62828', '#E53935',   // reds
  '#FF6D00', '#E65100', '#F57C00', '#FF8F00',   // oranges
  '#FBBC04', '#F9A825', '#F57F17', '#FFB300',   // yellows
];

// ── Particle ──────────────────────────────────
class Particle {
  constructor(initial = false) {
    this.reset(initial);
  }

  reset(initial = false) {
    this.x = Math.random() * W;
    this.y = initial ? Math.random() * H : H + 16;

    // Mostly upward, slight horizontal spread
    const spd  = 0.35 + Math.random() * 1.1;
    const ang  = -Math.PI / 2 + (Math.random() - 0.5) * 1.1;
    this.vx    = Math.cos(ang) * spd;
    this.vy    = Math.sin(ang) * spd;

    this.bw    = 1.8 + Math.random() * 1.4;          // base width
    this.bh    = 7   + Math.random() * 11;            // base height
    this.angle = Math.random() * Math.PI * 2;
    this.dAngle= (Math.random() - 0.5) * 0.028;      // rotation per frame

    // Bias color by x position: blue-purple left, red-yellow right
    const coolColors = COLORS.slice(0, 11);
    const warmColors = COLORS.slice(11);
    const t = Math.random(); // mix ratio
    const bias = this.x / (W || 1);
    const pool = (Math.random() < 0.55 - bias * 0.5 + 0.15)
      ? coolColors : warmColors;
    this.color   = pool[Math.floor(Math.random() * pool.length)];
    this.opacity = 0.60 + Math.random() * 0.38;
  }

  update() {
    // Mouse repulsion
    const dx = this.x - mouse.x;
    const dy = this.y - mouse.y;
    const d2 = dx * dx + dy * dy;
    const R  = 140;
    if (d2 < R * R && d2 > 0.1) {
      const d    = Math.sqrt(d2);
      const f    = ((R - d) / R) * 0.72;
      this.vx   += (dx / d) * f;
      this.vy   += (dy / d) * f;
    }

    // Damping
    this.vx *= 0.975;
    this.vy *= 0.975;

    // Keep minimum upward velocity (anti-gravity floor)
    if (this.vy > -0.25) this.vy -= 0.012;

    // Speed cap
    const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (spd > 7) { this.vx = this.vx / spd * 7; this.vy = this.vy / spd * 7; }

    this.x += this.vx;
    this.y += this.vy;

    // Slow rotation; when fast align toward velocity
    const velAngle = Math.atan2(this.vy, this.vx) + Math.PI / 2;
    if (spd > 0.8) {
      let diff = velAngle - this.angle;
      while (diff >  Math.PI) diff -= 2 * Math.PI;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      this.angle += diff * Math.min(spd / 8, 0.35);
    } else {
      this.angle += this.dAngle;
    }

    // Respawn
    if (this.y < -24 || this.x < -50 || this.x > W + 50) this.reset();
  }

  draw() {
    const spd    = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    const stretch= 1 + spd * 0.22;
    const w      = this.bw;
    const h      = this.bh * stretch;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.globalAlpha = this.opacity;
    ctx.fillStyle    = this.color;
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.restore();
  }
}

// ── Resize ────────────────────────────────────
let particles = [];

function resize() {
  canvas.width  = W = window.innerWidth;
  canvas.height = H = window.innerHeight;
}

function init() {
  resize();
  const count = Math.round(Math.min(420, W * H / 2800));
  particles = Array.from({ length: count }, () => new Particle(true));
}

// ── Animation loop ────────────────────────────
function tick() {
  ctx.clearRect(0, 0, W, H);
  for (const p of particles) { p.update(); p.draw(); }
  requestAnimationFrame(tick);
}

// ── Events ────────────────────────────────────
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseleave', ()  => { mouse.x = -9999; mouse.y = -9999; });
window.addEventListener('resize', resize);

// Click burst
window.addEventListener('click', e => {
  const bx = e.clientX, by = e.clientY;
  for (const p of particles) {
    const dx = p.x - bx, dy = p.y - by;
    const d  = Math.sqrt(dx * dx + dy * dy) || 1;
    if (d < 220) {
      const f = (220 - d) / 220 * 5;
      p.vx += dx / d * f;
      p.vy += dy / d * f;
    }
  }
});

// Scroll: particles drift horizontally on scroll
let lastScrollY = 0;
window.addEventListener('scroll', () => {
  const delta = window.scrollY - lastScrollY;
  lastScrollY = window.scrollY;
  for (const p of particles) {
    p.vy += delta * 0.04;
    p.vx += (Math.random() - 0.5) * Math.abs(delta) * 0.06;
  }
});

init();
tick();
</script>
</body>
</html>
